<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="200"
     viewBox="0 0 1000 200">

  <defs>
    <!-- Gradiente de Arcoíris -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="20%" stop-color="#00FFFF"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="80%" stop-color="#FF4FD8"/>
      <stop offset="100%" stop-color="#FACC15"/>

      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Resplandor (Glow) -->
    <filter id="rainbowGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- FONDO TRANSPARENTE PARA GITHUB -->
  <rect width="1000" height="200" fill="transparent"/>

  <!-- TÍTULO CON ANIMACIÓN DE ESTELA (TRAIL) -->
  <g font-family="'Press Start 2P', 'Courier New', monospace"
     font-size="64"
     font-weight="bold"
     text-anchor="middle">

    <!-- Estela 1 (Más alejada) -->
    <text x="500" y="90" fill="#00FFFF" opacity="0.18">
      SimpleGP
      <animateTransform attributeName="transform" type="translate" values="-18 0;18 0;-18 0" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- Estela 2 (Media) -->
    <text x="500" y="90" fill="#A855F7" opacity="0.25">
      SimpleGP
      <animateTransform attributeName="transform" type="translate" values="-12 0;12 0;-12 0" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- Estela 3 (Cercana) -->
    <text x="500" y="90" fill="#FF4FD8" opacity="0.35">
      SimpleGP
      <animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- Título Principal con resplandor -->
    <text x="500" y="90" fill="url(#rainbow)" filter="url(#rainbowGlow)">
      SimpleGP
      <animateTransform attributeName="transform" type="translate" values="-4 0;4 0;-4 0" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Subtítulo -->
  <text x="500" y="145"
        text-anchor="middle"
        font-family="'Press Start 2P', 'Courier New', monospace"
        font-size="17"
        font-weight="bold"
        fill="#00FF88"
        letter-spacing="2">
    SOFTWARE ENGINEER
  </text>

  <!-- Separador pixelado animado -->
  <line x1="350" y1="175"
        x2="650" y2="175"
        stroke="url(#rainbow)"
        stroke-width="3"
        stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;32" dur="1s" repeatCount="indefinite"/>
  </line>

</svg>
